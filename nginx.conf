# INGBOEX Website Nginx Configuration
# For Nginx servers

server {
    listen 80;
    server_name www.ingboex.com ingboex.com;
    # Force HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ingboex.com ingboex.com;

    # SSL certificates (configure with your actual paths)
    ssl_certificate /etc/letsencrypt/live/ingboex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingboex.com/privkey.pem;

    root /var/www/ingboex;
    index index.html;

    # ============================================
    # Security Headers
    # ============================================

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co;" always;

    # X-Frame-Options
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # X-XSS-Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # Gzip Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/html
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Don't compress already compressed files
    gzip_disable "msie6";
    gzip_proxied any;

    # ============================================
    # Browser Caching
    # ============================================

    # HTML - no cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets - 30 days
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff2|mp4|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # XML/TXT - no cache
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # Security: Block Sensitive Files
    # ============================================
    location ~ /\.(git|svn|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location ~* \.(sql|bak|log|ini|sh|conf)$ {
        deny all;
        return 404;
    }

    # ============================================
    # Directory Listing Protection
    # ============================================
    autoindex off;

    # ============================================
    # Custom Error Pages
    # ============================================
    error_page 404 /404.html;
    error_page 403 /404.html;

    # ============================================
    # Main Location
    # ============================================
    location / {
        try_files $uri $uri/ =404;
    }

    # ============================================
    # Old URL 301 Redirects (WordPress migration)
    # ============================================
    rewrite ^/about/?$ /about.html permanent;
    rewrite ^/contact-us/?$ /contact.html permanent;
    rewrite ^/get-in-touch/?$ /contact.html permanent;
    rewrite ^/products/?$ /products.html permanent;
    rewrite ^/faq/?$ /faq.html permanent;
    rewrite ^/news/?$ /news.html permanent;
    rewrite ^/product-epilator-and-grooming/?$ /products/epilator-and-grooming.html permanent;
    rewrite ^/products-shaver/?$ /products/shaver.html permanent;
    rewrite ^/product-hair-clipper/?$ /products/hair-clipper.html permanent;
    rewrite ^/product-electric-precision-trimmer/?$ /products/electric-precision-trimmer.html permanent;
    rewrite ^/hair-dryer/?$ /products/hair-dryer.html permanent;
    rewrite ^/hot-air-brush/?$ /products/hot-air-brush.html permanent;
    rewrite ^/hair-straightener/?$ /products/hair-straightener.html permanent;
    rewrite ^/hair-curler/?$ /products/hair-curler.html permanent;
    rewrite ^/hair-straightening-brush/?$ /products/hair-straightening-brush.html permanent;
}
